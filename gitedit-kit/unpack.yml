name: Auto Unpack ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack any .zip archives in repository
        run: |
          shopt -s nullglob
          mapfile -t zips < <(find . -maxdepth 2 -name '*.zip' -not -path './.git/*')
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No .zip archives found — repository is already unpacked and clean."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "Unpacking $z ..."
            tmp_dir=$(mktemp -d)
            unzip -oq "$z" -d "$tmp_dir"
            rm -rf "$tmp_dir/__MACOSX"

            entries=("$tmp_dir"/* "$tmp_dir"/.*)
            filtered=()
            for e in "${entries[@]}"; do
              base=$(basename "$e")
              if [ "$base" != "." ] && [ "$base" != ".." ] && [ -e "$e" ]; then
                filtered+=("$e")
              fi
            done

            if [ "${#filtered[@]}" -eq 1 ] && [ -d "${filtered[0]}" ] && [ "$(basename "${filtered[0]}")" != ".github" ]; then
              rm -rf "${filtered[0]}/.github/workflows"
              cp -a "${filtered[0]}"/. .
            else
              rm -rf "$tmp_dir/.github/workflows"
              cp -a "$tmp_dir"/. .
            fi

            rm -rf "$tmp_dir"
            rm -f "$z"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes after unpacking."
          else
            git commit -m "chore: auto-unpack uploaded zip archive"
            git push
          fi
