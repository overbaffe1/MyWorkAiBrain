    --crys-bl: rgba(124, 58, 237, 0.84);
    --crys-br: rgba(91, 33, 182, 0.92);
    --crys-st-top: #8B5A19;
    --crys-st-bot: #4C1D95;
    --crys-glow: #E3B663;
    --crys-node: #FFFBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E080D;
      --bg-2: #180E16;
      --bg-card: #160D15;
      --veil-0: rgba(14, 8, 13, 0.98);
      --veil-1: rgba(14, 8, 13, 0.88);
      --veil-2: rgba(14, 8, 13, 0.00);
      --ink: #F8F0E3;
      --ink-soft: #CBBAB8;
      --muted: #968186;
      --brass: #E6BC6A;
      --brass-hi: #F7D78E;
      --brass-faint: rgba(230, 188, 106, 0.16);
      --violet: #B48EFF;
      --violet-hi: #D1B8FF;
      --violet-faint: rgba(180, 142, 255, 0.16);
      --crimson: #F26B83;
      --teal: #57D1C4;
      --line: rgba(248, 240, 227, 0.12);
      --line-strong: rgba(230, 188, 106, 0.34);
      --beam-a: rgba(230, 188, 106, 0.14);
      --beam-b: rgba(180, 142, 255, 0.11);
      --mesh-fill: #1C111A;
      --mesh-shade: #281824;
      --mesh-edge: #E8C378;
      --mesh-rib: rgba(232, 195, 120, 0.20);
      --ghost: rgba(180, 142, 255, 0.30);
      --crys-tl: rgba(232, 194, 122, 0.90);
      --crys-tr: rgba(185, 128, 44, 0.92);
      --crys-bl: rgba(109, 55, 184, 0.82);
      --crys-br: rgba(70, 32, 125, 0.88);
