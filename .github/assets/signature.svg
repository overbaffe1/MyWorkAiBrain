    --brass-faint: rgba(143, 91, 20, 0.16);
    --violet: #6D28D9;
    --violet-hi: #7C3AED;
    --violet-faint: rgba(109, 40, 217, 0.13);
    --crimson: #9F1D35;
    --teal: #0F6E66;
    --line: rgba(34, 20, 24, 0.14);
