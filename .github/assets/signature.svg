<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 132" width="960" height="132" role="img" aria-label="Колофон мастерской MyWorkAiBrain">
  <style>
    
  :root {
    --bg: #F6EFE2;
    --bg-2: #EDE2CE;
