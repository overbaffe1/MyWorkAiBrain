<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="MyWorkAiBrain — Конвейер живых 3D-презентаций для PowerPoint">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E080B"/>
      <stop offset="52%" stop-color="#171024"/>
      <stop offset="100%" stop-color="#0D1524"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6EFE4"/>
      <stop offset="55%" stop-color="#E8C27A"/>
      <stop offset="100%" stop-color="#C8923B"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3B663"/>
      <stop offset="50%" stop-color="#9D5CFF"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="81%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#E3B663" stop-opacity="0.24"/>
      <stop offset="48%" stop-color="#8A2BE2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0E080B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4A3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E3B663" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E3B663" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="280" rx="18"/>
    </clipPath>
    <style>
      .kicker { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #E3B663; letter-spacing: 2.4px; }
      .title { font: 700 50px Georgia, 'Times New Roman', serif; fill: url(#goldGrad); }
      .sub { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; fill: #CFC5BC; }
      .pipe { font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #A78BFA; }
      .chip-txt { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; fill: #EDE4D8; }
      .chip-num { fill: #E3B663; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#stageGlow)"/>

    <!-- Subtle animated bottom waves -->
    <path fill="#8A2BE2" fill-opacity="0.08">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,235 C300,205 620,268 920,232 C1060,215 1140,225 1200,234 L1200,280 L0,280 Z;
                M0,244 C320,268 600,206 910,242 C1050,258 1140,236 1200,226 L1200,280 L0,280 Z;
                M0,235 C300,205 620,268 920,232 C1060,215 1140,225 1200,234 L1200,280 L0,280 Z"/>
    </path>
    <path fill="#E3B663" fill-opacity="0.06">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M0,252 C280,274 640,220 960,252 C1080,264 1150,248 1200,244 L1200,280 L0,280 Z;
                M0,242 C290,218 650,268 950,238 C1080,225 1150,245 1200,254 L1200,280 L0,280 Z;
                M0,252 C280,274 640,220 960,252 C1080,264 1150,248 1200,244 L1200,280 L0,280 Z"/>
    </path>

    <!-- Museum exhibit astrolabe & 3D rigged crystal on the right -->
    <g transform="translate(990, 140)">
      <circle r="110" fill="none" stroke="#E3B663" stroke-opacity="0.16" stroke-width="1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <circle r="90" fill="none" stroke="#E3B663" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="5 7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <circle r="68" fill="none" stroke="#A78BFA" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="18 8 3 8"/>
      </g>
      <ellipse rx="82" ry="25" fill="none" stroke="#E3B663" stroke-opacity="0.28" stroke-width="1.1" transform="rotate(-18)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="90" cy="0" r="3.2" fill="#E3B663"/>
        <circle cx="-68" cy="0" r="2.6" fill="#A78BFA"/>
      </g>

      <circle cx="0" cy="0" r="42" fill="url(#coreGlow)">
        <animate attributeName="r" values="38;46;38" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.72;1;0.72" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0,4; 0,-6; 0,4" dur="4.4s" repeatCount="indefinite"/>
        <polygon points="0,-56 -41,-4 0,12" fill="#E8C27A" fill-opacity="0.88" stroke="#FFF3D1" stroke-width="1"/>
        <polygon points="0,-56 41,-4 0,12" fill="#B9802C" fill-opacity="0.90" stroke="#F6DBA0" stroke-width="1"/>
        <polygon points="-41,-4 0,12 0,58" fill="#6D37B8" fill-opacity="0.78" stroke="#C4B5FD" stroke-width="1"/>
        <polygon points="41,-4 0,12 0,58" fill="#46207D" fill-opacity="0.85" stroke="#A78BFA" stroke-width="1"/>
        <circle cx="0" cy="-56" r="3.2" fill="#FFF7E0"/>
        <circle cx="-41" cy="-4" r="2.8" fill="#E3B663"/>
        <circle cx="41" cy="-4" r="2.8" fill="#E3B663"/>
        <circle cx="0" cy="12" r="3.4" fill="#FFF7E0"/>
        <circle cx="0" cy="58" r="3.0" fill="#C4B5FD"/>
      </g>
    </g>

    <!-- Left editorial content -->
    <rect x="52" y="34" width="34" height="2" fill="#E3B663"/>
    <text x="96" y="39" class="kicker">AI PIPELINE · BLENDER BPY · OPENXML 3D</text>

    <text x="52" y="104" class="title">MyWorkAiBrain</text>
    <rect x="52" y="120" width="540" height="2" fill="url(#accentLine)"/>

    <text x="52" y="154" class="sub">Генерация живых редактируемых 3D-презентаций PowerPoint чистым кодом</text>

    <text x="52" y="185" class="pipe">
      &gt; bpy + rig.py ──► skinned .glb ──► am3d:model3d + Morph ──► .pptx
      <tspan fill="#E3B663">▋<animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>

    <!-- Metric pills (centered text inside each pill) -->
    <g transform="translate(52, 214)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#E3B663" stroke-opacity="0.35"/>
      <text x="90" y="20.5" text-anchor="middle" class="chip-txt"><tspan class="chip-num">5</tspan> эталонных проектов</text>

      <rect x="192" y="0" width="156" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#E3B663" stroke-opacity="0.35"/>
      <text x="270" y="20.5" text-anchor="middle" class="chip-txt"><tspan class="chip-num">42</tspan> живых слайда</text>

      <rect x="360" y="0" width="204" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#A78BFA" stroke-opacity="0.4"/>
      <text x="462" y="20.5" text-anchor="middle" class="chip-txt"><tspan class="chip-num">45+</tspan> процедурных 3D-сцен</text>

      <rect x="576" y="0" width="166" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="659" y="20.5" text-anchor="middle" class="chip-txt"><tspan class="chip-num">0</tspan> нейрокартинок</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="17.5" fill="none" stroke="#E3B663" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
